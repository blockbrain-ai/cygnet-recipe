<svg xmlns="http://www.w3.org/2000/svg" width="880" height="356" viewBox="0 0 880 356" role="img" aria-labelledby="t d"><title id="t">How Cygnet reads a decision</title><desc id="d">JevBench public item original-extraction-01-1. The options are lettered A to D and Gemma-4-12B-it answers with one token, limited to those letters. The shim sums every token that decodes to the same letter, renormalises over the options, and applies one temperature, T = 3.4. courier: 0.03% before the temperature, 7.58% as returned; pickup: 99.95% before the temperature, 82.7% as returned; post: &lt;0.01% before the temperature, 2.66% as returned; unknown: 0.02% before the temperature, 7.04% as returned.</desc><style>.serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,serif}.sans{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}text{font-variant-numeric:tabular-nums}.sky{fill:#f2f4f9}.surface{fill:#ffffff}.surface2{fill:#e9edf4}.line{fill:#d9dee8}.ink{fill:#141b2d}.ink2{fill:#46506a}.ink3{fill:#737c92}.gold{fill:#a26f00}.glow{fill:#8f6200}.slate{fill:#8590a6}.grid{fill:#141b2d17}.tint{fill:#a26f0014}.bar{transform-box:fill-box;transform-origin:0 50%}@keyframes s0{0%,32.50%{transform:scaleX(0.0003);animation-timing-function:cubic-bezier(0.2,0,0,1)}38.12%,91.25%{transform:scaleX(0.0758);animation-timing-function:cubic-bezier(0.2,0,0,1)}95.00%,100%{transform:scaleX(0.0003)}}.s0{transform:scaleX(0.0758);animation:s0 8.0s infinite}@keyframes s1{0%,32.50%{transform:scaleX(0.9995);animation-timing-function:cubic-bezier(0.2,0,0,1)}38.12%,91.25%{transform:scaleX(0.8272);animation-timing-function:cubic-bezier(0.2,0,0,1)}95.00%,100%{transform:scaleX(0.9995)}}.s1{transform:scaleX(0.8272);animation:s1 8.0s infinite}@keyframes s2{0%,32.50%{transform:scaleX(0.0000);animation-timing-function:cubic-bezier(0.2,0,0,1)}38.12%,91.25%{transform:scaleX(0.0266);animation-timing-function:cubic-bezier(0.2,0,0,1)}95.00%,100%{transform:scaleX(0.0000)}}.s2{transform:scaleX(0.0266);animation:s2 8.0s infinite}@keyframes s3{0%,32.50%{transform:scaleX(0.0002);animation-timing-function:cubic-bezier(0.2,0,0,1)}38.12%,91.25%{transform:scaleX(0.0704);animation-timing-function:cubic-bezier(0.2,0,0,1)}95.00%,100%{transform:scaleX(0.0002)}}.s3{transform:scaleX(0.0704);animation:s3 8.0s infinite}@keyframes before{0%,32.50%{opacity:1}36.25%,91.88%{opacity:0}95.00%,100%{opacity:1}}.before{opacity:0;animation:before 8.0s infinite}@keyframes after{0%,34.38%{opacity:0}38.12%,91.25%{opacity:1}93.75%,100%{opacity:0}}.after{animation:after 8.0s infinite}@media (prefers-reduced-motion:reduce){.bar,.before,.after{animation:none}.before{opacity:0}.after{opacity:1}}</style><rect x="1" y="1" width="878.00" height="354" rx="14" fill="#ffffff" stroke="#d9dee8"/><text x="32" y="42" font-size="11" class="sans ink3" font-weight="600" letter-spacing="0.8">ONE JEVBENCH PUBLIC ITEM</text><text x="32" y="68" font-size="14" class="serif ink" font-style="italic">“The final arrangement is depot pickup,</text><text x="32" y="88" font-size="14" class="serif ink" font-style="italic">replacing the earlier courier idea.”</text><text x="32" y="116" font-size="12.5" class="sans ink2">Extract the final confirmed delivery method.</text><text x="32" y="134" font-size="12.5" class="sans ink2">Ignore cancelled plans and hypothetical alternatives.</text><rect x="32" y="162" width="272.00" height="24" rx="6" fill="#e9edf4"/><text x="44" y="179" font-size="13" class="mono gold" font-weight="700">A</text><text x="64" y="179" font-size="13" class="mono ink">courier</text><text x="134" y="179" font-size="12" class="sans ink3">Courier delivery</text><rect x="32" y="192" width="272.00" height="24" rx="6" fill="#e9edf4"/><text x="44" y="209" font-size="13" class="mono gold" font-weight="700">B</text><text x="64" y="209" font-size="13" class="mono ink">pickup</text><text x="134" y="209" font-size="12" class="sans ink3">Customer pickup</text><rect x="32" y="222" width="272.00" height="24" rx="6" fill="#e9edf4"/><text x="44" y="239" font-size="13" class="mono gold" font-weight="700">C</text><text x="64" y="239" font-size="13" class="mono ink">post</text><text x="134" y="239" font-size="12" class="sans ink3">Postal service</text><rect x="32" y="252" width="272.00" height="24" rx="6" fill="#e9edf4"/><text x="44" y="269" font-size="13" class="mono gold" font-weight="700">D</text><text x="64" y="269" font-size="13" class="mono ink">unknown</text><text x="134" y="269" font-size="12" class="sans ink3">No final confirmed method</text><rect x="330" y="52" width="196.00" height="236" rx="12" fill="#f2f4f9" stroke="#d9dee8"/><text x="428" y="84" font-size="16" class="serif ink" text-anchor="middle">Gemma-4-12B-it</text><text x="428" y="104" font-size="12" class="sans ink3" text-anchor="middle">frozen, on stock vLLM 0.30.0</text><text x="348" y="138" font-size="12.5" class="sans ink2">one forward pass;</text><text x="348" y="158" font-size="12.5" class="sans ink2">the answer position may</text><text x="348" y="178" font-size="12.5" class="sans ink2">only be A, B, C or D;</text><text x="348" y="198" font-size="12.5" class="sans ink2">20 log-probabilities back;</text><text x="348" y="218" font-size="12.5" class="sans ink2">tokens that decode to the</text><text x="348" y="238" font-size="12.5" class="sans ink2">same letter are summed</text><text x="428" y="274" font-size="12" class="mono ink3" text-anchor="middle">154 in · 1 out · 0.050 s</text><path d="M308 170h14m-5 -5l5 5l-5 5" fill="none" stroke="#737c92" stroke-width="1.5"/><path d="M536 170h14m-5 -5l5 5l-5 5" fill="none" stroke="#737c92" stroke-width="1.5"/><g class="before"><text x="562" y="42" font-size="11" class="sans ink3" font-weight="600" letter-spacing="0.8">BEFORE THE TEMPERATURE (T = 1)</text></g><g class="after"><text x="562" y="42" font-size="11" class="sans ink2" font-weight="600" letter-spacing="0.8">AS RETURNED (T = 3.4)</text></g><text x="562" y="80" font-size="14" class="mono ink2">courier</text><rect x="562" y="90" width="200.00" height="12" rx="0" fill="#e9edf4"/><rect class="bar s0" x="562" y="90" width="200" height="12" fill="#8590a6"/><g class="before"><text x="838" y="80" font-size="14" class="mono ink2" text-anchor="end">0.03%</text></g><g class="after"><text x="838" y="80" font-size="14" class="mono ink2" text-anchor="end">7.58%</text></g><text x="562" y="130" font-size="14" class="mono ink" font-weight="600">pickup</text><rect x="562" y="140" width="200.00" height="12" rx="0" fill="#e9edf4"/><rect class="bar s1" x="562" y="140" width="200" height="12" fill="#a26f00"/><g class="before"><text x="838" y="130" font-size="14" class="mono ink" font-weight="600" text-anchor="end">99.95%</text></g><g class="after"><text x="838" y="130" font-size="14" class="mono ink" font-weight="600" text-anchor="end">82.7%</text></g><text x="562" y="180" font-size="14" class="mono ink2">post</text><rect x="562" y="190" width="200.00" height="12" rx="0" fill="#e9edf4"/><rect class="bar s2" x="562" y="190" width="200" height="12" fill="#8590a6"/><g class="before"><text x="838" y="180" font-size="14" class="mono ink2" text-anchor="end">&lt;0.01%</text></g><g class="after"><text x="838" y="180" font-size="14" class="mono ink2" text-anchor="end">2.66%</text></g><text x="562" y="230" font-size="14" class="mono ink2">unknown</text><rect x="562" y="240" width="200.00" height="12" rx="0" fill="#e9edf4"/><rect class="bar s3" x="562" y="240" width="200" height="12" fill="#8590a6"/><g class="before"><text x="838" y="230" font-size="14" class="mono ink2" text-anchor="end">0.02%</text></g><g class="after"><text x="838" y="230" font-size="14" class="mono ink2" text-anchor="end">7.04%</text></g><text x="32" y="322" font-size="12" class="sans ink3">Recorded in runs/l40s-pinned/results.jsonl (item original-extraction-01-1, answered correctly). The T = 1 figures undo the temperature exactly:</text><text x="32" y="340" font-size="12" class="sans ink3">p ∝ p_returned^3.4. T = 3.4 was fitted on 241 items of our own; JevBench's public items were never used to fit it.</text></svg>
