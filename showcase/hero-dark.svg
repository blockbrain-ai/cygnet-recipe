<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290" role="img" aria-labelledby="t d"><title id="t">Cygnet: No. 1 overall on JevBench v1.5.4</title><desc id="d">Cygnet, typed decisions from frozen Gemma-4-12B with one token per decision, ranks first of 106 systems on the official JevBench v1.5.4 score at 73.70, ahead of Winnow-12B Q8 at 73.23 (a statistical tie) and Jev 1.13.0 at 72.13.</desc><style>.serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,serif}.sans{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}text{font-variant-numeric:tabular-nums}.sky{fill:#0a0f1e}.surface{fill:#121a2e}.surface2{fill:#1a2340}.line{fill:#263050}.ink{fill:#e9edf7}.ink2{fill:#aeb7cc}.ink3{fill:#8a93aa}.gold{fill:#bb8a22}.glow{fill:#f0b429}.slate{fill:#74809a}.grid{fill:#e9edf71c}.tint{fill:#f0b4291a}</style><rect x="1" y="1" width="878.00" height="288" rx="16" fill="#0a0f1e" stroke="#263050"/><line x1="46.44" y1="41.68" x2="61.16" y2="56.4" stroke="#f0b429" stroke-width="1.5333333333333334"/><line x1="61.16" y1="56.4" x2="70.36" y2="67.44" stroke="#f0b429" stroke-width="1.5333333333333334"/><line x1="70.36" y1="67.44" x2="81.4" y2="80.32" stroke="#f0b429" stroke-width="1.5333333333333334"/><line x1="79.56" y1="44.44" x2="61.16" y2="56.4" stroke="#f0b429" stroke-width="1.5333333333333334"/><line x1="61.16" y1="56.4" x2="44.6" y2="72.04" stroke="#f0b429" stroke-width="1.5333333333333334"/><circle cx="46.4" cy="41.7" r="3.9" fill="#f0b429"/><circle cx="61.2" cy="56.4" r="3.9" fill="#f0b429"/><circle cx="70.4" cy="67.4" r="2.8" fill="#f0b429"/><circle cx="81.4" cy="80.3" r="2.8" fill="#f0b429"/><circle cx="79.6" cy="44.4" r="2.8" fill="#f0b429"/><circle cx="44.6" cy="72.0" r="2.8" fill="#f0b429"/><text x="100" y="78" font-size="46" class="serif ink">Cygnet</text><text x="40" y="128" font-size="18" class="sans ink2">Typed decisions from frozen Gemma-4-12B,</text><text x="40" y="153" font-size="18" class="sans ink2">one token per decision.</text><text x="40" y="214" font-size="30" class="serif glow">No. 1 overall on JevBench</text><text x="40" y="246" font-size="13" class="mono ink3">stock weights  ·  no fine-tuning  ·  one output token</text><rect x="520" y="34" width="322.00" height="222" rx="12" fill="#121a2e" stroke="#263050"/><text x="542" y="66" font-size="11" class="sans ink3" font-weight="600" letter-spacing="0.8">JEVBENCH V1.5.4  ·  OFFICIAL SCORE</text><rect x="530" y="82" width="302.00" height="40" rx="8" fill="#f0b4291a"/><text x="546" y="110" font-size="26" class="serif glow">1</text><text x="580" y="108" font-size="16" class="sans ink" font-weight="600">Cygnet</text><text x="818" y="108" font-size="16" class="mono ink" font-weight="600" text-anchor="end">73.70</text><text x="546" y="154" font-size="26" class="serif ink3">2</text><text x="580" y="152" font-size="16" class="sans ink2">Winnow-12B Q8</text><text x="818" y="152" font-size="16" class="mono ink2" text-anchor="end">73.23</text><text x="546" y="198" font-size="26" class="serif ink3">3</text><text x="580" y="196" font-size="16" class="sans ink2">Jev 1.13.0</text><text x="818" y="196" font-size="16" class="mono ink2" text-anchor="end">72.13</text><text x="542" y="236" font-size="12" class="sans ink3">of 106 ranked  ·  1 and 2 are a statistical tie</text></svg>
